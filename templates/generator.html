{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Generate Custom Client</title>
    <style>
        body {font-family: Arial, sans-serif; margin: 2rem;}
        label {display: block; margin-top: 1rem;}
        input, textarea, select {width: 100%; max-width: 400px;}
        .error {color: #c00;}
    </style>
</head>
<body>
<h1>Generate Custom Client</h1>

<form method="post" enctype="multipart/form-data" action="{% url 'generator_view' %}">
    {% csrf_token %}

    <!-- Required core fields -->
    <label>App name (will appear in the UI):
        <input type="text" name="appname" required value="{{ form.appname.value|default_if_none:'' }}">
    </label>

    <label>DMG / EXE filename (without extension):
        <input type="text" name="filename" required value="{{ form.filename.value|default_if_none:'' }}">
    </label>

    <label>RustDesk version to build:
        {{ form.version }}
    </label>

    <label>Custom EXE name (optional – needed only for Windows builds):
        <input type="text" name="exename" value="{{ form.exename.value|default_if_none:'' }}">
    </label>

    <label>Direction (incoming/outgoing/bidirectional):
        {{ form.direction }}
    </label>

    <label>Installation (enable/disable):
        {{ form.installation }}
    </label>

    <label>Settings (enable/disable):
        {{ form.settings }}
    </label>

    <label>Theme:
        {{ form.theme }}
    </label>

    <label>Theme – default or override:
        {{ form.themeDorO }}
    </label>

    <label>Pass‑approve mode:
        {{ form.passApproveMode }}
    </label>

    <label>Permissions – default or override:
        {{ form.permissionsDorO }}
    </label>

    <label>Permissions type (custom/full/view):
        {{ form.permissionsType }}
    </label>

    <!-- Optional auxiliary fields – keep them for completeness -->
    <label>Slogan / quote (will be embedded via custom.txt):
        <input type="text" name="slogan" value="{{ form.slogan.value|default_if_none:'' }}">
    </label>

    <label>Company name (shown in About dialog):
        <input type="text" name="compname" value="{{ form.compname.value|default_if_none:'' }}">
    </label>

    <label>Custom text (will be base64‑encoded into custom.txt):
        <textarea name="custom" rows="4">{{ form.custom.value|default_if_none:'' }}</textarea>
    </label>

    <label>App icon (PNG, square):
        <input type="file" name="iconfile" accept="image/png">
    </label>

    <label>App logo (PNG):
        <input type="file" name="logofile" accept="image/png">
    </label>

    <label>Target platform:
        {{ form.platform }}
    </label>

    <button type="submit" style="margin-top:1rem;">Generate</button>
</form>

{% if form.errors %}
    <h3 class="error">Form validation errors</h3>
    <ul class="error">
    {% for field, errors in form.errors.items %}
        <li><strong>{{ field }}:</strong> {{ errors|join:", " }}</li>
    {% endfor %}
    </ul>
{% endif %}

</body>
</html>
