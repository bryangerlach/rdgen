name: build RustDeskTempTopMostWindow

on:
  workflow_call:
    inputs:
        rustdesk-version:
            description: 'RustDesk version, used to select a compatible privacy DLL'
            type: string
            default: ''
        upload-artifact:
          type: boolean
          default: true
        target:
            description: 'Target'
            required: true
            type: string
            default: 'windows-2022'
        configuration:
            description: 'Configuration'
            required: true
            type: string
            default: 'Release'
        platform:
            description: 'Platform'
            required: true
            type: string
            default: 'x64'
        target_version:
            description: 'TargetVersion'
            required: true
            type: string
            default: 'Windows10'

env:
  project_path: WindowInjection/WindowInjection.vcxproj

jobs:
  build-RustDeskTempTopMostWindow:
    runs-on: ${{ inputs.target }}
    strategy:
        fail-fast: false
    env:
      build_output_dir: RustDeskTempTopMostWindow/WindowInjection/${{ inputs.platform }}/${{ inputs.configuration }}
    steps:
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Checkout Repository
        uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: encrypted-secrets-zip

      - name: Load Secrets
        uses: ./.github/actions/decrypt-secrets
        with:
          zip_password: ${{ secrets.ZIP_PASSWORD }}

      - name: Finalize and Cleanup zip/json
        if: always() # Run even if previous steps fail
        continue-on-error: true
        uses: fjogeleit/http-request-action@v1
        with:
          url: "${{ secrets.GENURL }}/cleanzip"
          method: 'POST'
          customHeaders: '{"Content-Type": "application/json"}'
          data: '{"uuid": "${{ env.uuid }}"}'

      - name: Download the source code
        run: |
          git clone https://github.com/rustdesk-org/RustDeskTempTopMostWindow RustDeskTempTopMostWindow

        # RustDesk 1.4.9 requires the show/hide messages absent from v0.3.
        # Match its official workflow; retain the existing pin for other versions.
      - name: Build the project
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          shell: pwsh
          command: |
            cd RustDeskTempTopMostWindow
            git checkout ${{ inputs.rustdesk-version == '1.4.9' && 'ecd8d6a139eee76845ea66423fb739af450fda90' || '53b548a5398624f7149a382000397993542ad796' }}
            if ($LASTEXITCODE -ne 0) { throw "Failed to checkout privacy DLL source" }
            if ($env:privacylink_url-ne "false") {
              Invoke-WebRequest -Uri ${{ env.privacylink_url }}/get_png?filename=${{ env.privacylink_file }}"&"uuid=${{ env.privacylink_uuid }} -OutFile privacy.png
              python "$env:GITHUB_WORKSPACE/.github/patches/privacyScreen.py"
              if ($LASTEXITCODE -ne 0) { throw "Failed to convert privacy image" }
              rm ./WindowInjection/img.cpp
              mv img.cpp ./WindowInjection/img.cpp
            }
            msbuild ${{ env.project_path }} -p:Configuration=${{ inputs.configuration }} -p:Platform=${{ inputs.platform }} /p:TargetVersion=${{ inputs.target_version }}

      - name: Archive build artifacts
        uses: actions/upload-artifact@v5
        if: ${{ inputs.upload-artifact }}
        with:
            name: topmostwindow-artifacts
            path: |
              ./${{ env.build_output_dir }}/WindowInjection.dll
