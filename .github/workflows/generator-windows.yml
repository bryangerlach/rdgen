name: Custom Windows Client Generator
run-name: ${{ inputs.label && format('{0} - {1}', 'Windows', inputs.label) || 'Custom Windows Client Generator' }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'version to buld'
        required: true
        default: ''
        type: string
      zip_url:
        description: 'url to zip of json'
        required: true
        default: ''
        type: string
      label:
        description: 'build label (shown in run name)'
        required: false
        default: ''
        type: string


env:
  SCITER_RUST_VERSION: "1.75" # https://github.com/rustdesk/rustdesk/discussions/7503, also 1.78 has ABI change which causes our sciter version not working, https://blog.rust-lang.org/2024/03/30/i128-layout-update.html
  RUST_VERSION: "1.75" # sciter failed on m1 with 1.78 because of https://blog.rust-lang.org/2024/03/30/i128-layout-update.html
  CARGO_NDK_VERSION: "3.1.2"
  SCITER_ARMV7_CMAKE_VERSION: "3.29.7"
  SCITER_NASM_DEBVERSION: "2.15.05-1"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  # for arm64 linux because official Dart SDK does not work
  FLUTTER_ELINUX_VERSION: "3.16.9"
  TAG_NAME: "${{ inputs.upload-tag }}"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  # vcpkg version: 2024.07.12
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  ARMV7_VCPKG_COMMIT_ID: "6f29f12e82a8293156836ad81cc9bf5af41fe836"
  VERSION: "${{ inputs.version }}"
  NDK_VERSION: "r28c"
  #signing keys env variable checks
  ANDROID_SIGNING_KEY: "${{ secrets.ANDROID_SIGNING_KEY }}"
  MACOS_P12_BASE64: "${{ secrets.MACOS_P12_BASE64 }}"
  UPLOAD_ARTIFACT: 'true'
  SIGN_BASE_URL: "${{ secrets.SIGN_BASE_URL }}"
  STATUS_URL: "${{ secrets.GENURL }}/updategh"


jobs:
  setup:
    uses: ./.github/workflows/fetch-encrypted-secrets.yml
    with:
      zip_url_json: ${{ inputs.zip_url }}

  generate-bridge:
    uses: ./.github/workflows/bridge.yml
    with:
      version: ${{ inputs.version }}

  build-RustDeskTempTopMostWindow:
    needs: setup
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      rustdesk-version: ${{ inputs.version }}
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10
    secrets: inherit
    strategy:
      fail-fast: false

  build-for-windows-flutter:
    name: Build Windows
    needs: [build-RustDeskTempTopMostWindow, generate-bridge, setup]
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          # - { target: i686-pc-windows-msvc        , os: windows-2022                  }
          # - { target: x86_64-pc-windows-gnu       , os: windows-2022                  }
          - {
              target: x86_64-pc-windows-msvc,
              os: windows-2022,
              arch: x86_64,
              flutter-arch: x64,
              vcpkg-triplet: x64-windows-static,
              build-args: "--vram",
            }
          # - { target: aarch64-pc-windows-msvc, os: windows-2022, arch: aarch64 }
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: encrypted-secrets-zip

      - name: Load Secrets
        uses: ./.github/actions/decrypt-secrets
        with:
          zip_password: ${{ secrets.ZIP_PASSWORD }}

      - name: Finalize and Cleanup zip/json
        if: always() # Run even if previous steps fail
        continue-on-error: true
        uses: fjogeleit/http-request-action@v1
        with:
          url: "${{ secrets.GENURL }}/cleanzip"
          method: 'POST'
          customHeaders: '{"Content-Type": "application/json"}'
          data: '{"uuid": "${{ env.uuid }}"}'

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Set rdgen value
        if: ${{ env.rdgen == 'true' }}
        run: |
          echo "STATUS_URL=${{ secrets.GENURL }}/updategh" >> $env:GITHUB_ENV

      - name: Set rdgen value
        if: ${{ env.rdgen == 'false' }}
        run: |
          echo "STATUS_URL=${{ env.apiServer }}/api/updategh" >> $env:GITHUB_ENV

      - name: Checkout source code
        if: ${{ env.VERSION != 'master' }}
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: refs/tags/${{ env.VERSION }}
          submodules: recursive

      - name: Checkout source code
        if: ${{ env.VERSION == 'master' }}
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@master
        with:
          name: bridge-artifact
          path: ./

      - name: Install ImageMagick on Windows
        run: |
          choco install -y imagemagick.app --no-progress
          Get-ChildItem -Path "${env:ProgramFiles}" | % { $_.FullName } | Select-String -Pattern "[\/\\]ImageMagick[^\/\\]*$" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: fix flutter_gpu_texture_renderer (fixed in master rustdesk)
        shell: bash
        run: |
          sed -i -e 's|2ded7f146437a761ffe6981e2f742038f85ca68d|08a471bb8ceccdd50483c81cdfa8b81b07b14b87|' ./flutter/pubspec.lock
          sed -i -e 's|2ded7f146437a761ffe6981e2f742038f85ca68d|08a471bb8ceccdd50483c81cdfa8b81b07b14b87|' ./flutter/pubspec.yaml

      - name: Apply GL!TCH controller patches (force-login, Tech-tier ID visibility)
        shell: bash
        env:
          GL_APP: ${{ env.appname }}
          FNAME: ${{ env.filename }}
          RUNNO: ${{ github.run_number }}
        run: |
          set -e
          BUILDTAG="build $RUNNO, $(date -u +%b-%d' '%H:%M) UTC"
          echo "== GL!TCH controller patches; appname: '$GL_APP' filename: '$FNAME' =="
          echo "::notice title=GL!TCH patch step::run $RUNNO appname='$GL_APP' filename='$FNAME'"
          LC="${GL_APP,,} ${FNAME,,}"
          HOMEPAGE=flutter/lib/desktop/pages/desktop_home_page.dart
          if [[ "$LC" == *connect* || "$LC" == *tech* ]]; then
            # GitHub-hosted Windows runners often default core.autocrlf=true,
            # which would convert the checked-out files to CRLF and break
            # `git apply` below even though every patch here was built and
            # verified against LF.
            git config core.autocrlf false
            echo '' | base64 -d > glitch-force-login.diff
            git apply --verbose glitch-force-login.diff
            echo "force-login applied"
            if [[ "$LC" != *tech* ]]; then
              MSG="GlitchConnect enables you to connect remotely to your station. ($BUILDTAG)"
            else
              MSG="GlitchTech: technician console for connecting to client stations. ($BUILDTAG)"
            fi
            sed -i "s|translate(\"outgoing_only_desk_tip\")|'$MSG'|" "$HOMEPAGE"
            grep -q "login.dart" "$HOMEPAGE" && grep -q "_glitchLoginGate" "$HOMEPAGE" || { echo "ERROR: force-login patch missing"; exit 1; }
            grep -q "$MSG" "$HOMEPAGE" || { echo "ERROR: sidebar text patch missing"; exit 1; }
            echo "sidebar text set: $MSG"

            # GL!TCH: Tech-tier ID visibility - GlitchConnect and GlitchTech are one
            # build now. The manual ID-entry box, the peer-list row label, and the
            # session tab/window title all check the signed-in user's is_admin/is_tech
            # flag live (see CortenDesk's userPayload()), instead of being baked in
            # per build the way the old no-ID-box patch worked.
            echo '' | base64 -d > glitch-01-is-tech-field.diff
            echo '' | base64 -d > glitch-02-user-model-is-tech.diff
            echo '' | base64 -d > glitch-03-peer-card-id-gate.diff
            echo '' | base64 -d > glitch-04-tab-title-alias.diff
            echo '' | base64 -d > glitch-05-connection-page-id-box.diff
            git apply --verbose glitch-01-is-tech-field.diff
            git apply --verbose glitch-02-user-model-is-tech.diff
            git apply --verbose glitch-03-peer-card-id-gate.diff
            git apply --verbose glitch-04-tab-title-alias.diff
            git apply --verbose glitch-05-connection-page-id-box.diff
            echo '' | base64 -d > glitch-09-remove-connect-autocomplete-id.diff
            git apply --verbose glitch-09-remove-connect-autocomplete-id.diff
            echo '' | base64 -d > glitch-10-group-peer-alias.diff
            git apply --verbose glitch-10-group-peer-alias.diff
            echo '' | base64 -d > glitch-11-group-tab-favorite-star-no-ab.diff
            git apply --verbose glitch-11-group-tab-favorite-star-no-ab.diff
            grep -q '"alias": p.alias,' flutter/lib/common/hbbs/hbbs.dart || { echo "ERROR: group-tab alias mapping missing"; exit 1; }
            grep -q "groupFavStarButton" flutter/lib/common/widgets/peer_card.dart || { echo "ERROR: group-tab favorite star missing"; exit 1; }
            grep -q "bind.isDisableAb()" flutter/lib/common/widgets/peer_card.dart || { echo "ERROR: group-tab address-book menu gate missing"; exit 1; }
            echo "Group tab: clean title/subtitle, visible favorite star, no address-book menu item applied"
            grep -q "canSeeDeviceId" flutter/lib/models/user_model.dart || { echo "ERROR: Tech-tier patches missing"; exit 1; }
            grep -q "canSeeDeviceId" flutter/lib/desktop/pages/connection_page.dart || { echo "ERROR: ID-box runtime gate missing"; exit 1; }
            grep -q "peer.hostname.isNotEmpty" flutter/lib/common/widgets/peer_card.dart || { echo "ERROR: peer list ID-removal (hostname fallback) missing"; exit 1; }
            grep -q "peerPrimaryLabel($" flutter/lib/common/widgets/autocomplete.dart || { echo "ERROR: autocomplete ID-removal missing"; exit 1; }
            echo "Tech-tier ID visibility applied"
            echo "Peer ID never shown (alias/hostname only) applied"

            # GL!TCH: brand accent color - 2026-11-11 (Lawrence): the original
            # #B9F020 sampled from the logo reads as too fluorescent/neon in
            # the UI; toned down to a muted green in the same hue family.
            sed -i -e 's|0071FF|6FA83F|g' -e 's|2C8CFF|6FA83F|g' flutter/lib/common.dart
            grep -q "6FA83F" flutter/lib/common.dart || { echo "ERROR: brand color patch missing"; exit 1; }
            echo "brand accent applied: #6FA83F"

            echo "::notice title=GL!TCH patches applied::loginGate=$(grep -c _glitchLoginGate "$HOMEPAGE") techGate=$(grep -c canSeeDeviceId flutter/lib/desktop/pages/connection_page.dart) $BUILDTAG"
          else
            echo "Not a GlitchConnect/GlitchTech build; GL!TCH controller patches skipped"
            echo "::notice title=GL!TCH patches SKIPPED::appname='$GL_APP'"
          fi

      - name: change appname to custom
        if: env.appname != 'rustdesk'
        continue-on-error: true
        shell: bash
        run: |
          # ./Cargo.toml
          sed -i -e 's|description = "RustDesk Remote Desktop"|description = "${{ env.appname }}"|' ./Cargo.toml
          sed -i -e 's|ProductName = "RustDesk"|ProductName = "${{ env.appname }}"|' ./Cargo.toml
          sed -i -e 's|FileDescription = "RustDesk Remote Desktop"|FileDescription = "${{ env.appname }}"|' ./Cargo.toml
          sed -i -e 's|OriginalFilename = "rustdesk.exe"|OriginalFilename = "${{ env.appname }}.exe"|' ./Cargo.toml
          # ./libs/portable/Cargo.toml
          sed -i -e 's|description = "RustDesk Remote Desktop"|description = "${{ env.appname }}"|' ./libs/portable/Cargo.toml
          sed -i -e 's|ProductName = "RustDesk"|ProductName = "${{ env.appname }}"|' ./libs/portable/Cargo.toml
          sed -i -e 's|FileDescription = "RustDesk Remote Desktop"|FileDescription = "${{ env.appname }}"|' ./libs/portable/Cargo.toml
          sed -i -e 's|OriginalFilename = "rustdesk.exe"|OriginalFilename = "${{ env.appname }}.exe"|' ./libs/portable/Cargo.toml
          # ./libs/portable/src/main.rs
          sed -i -e 's|const APP_PREFIX: \&str = "rustdesk";|const APP_PREFIX: \&str = "${{ env.appname }}";|' ./libs/portable/src/main.rs
          # ./flutter/windows/runner/Runner.rc
          sed -i -e 's|"RustDesk Remote Desktop"|"${{ env.appname }}"|' ./flutter/windows/runner/Runner.rc
          sed -i -e 's|VALUE "InternalName", "rustdesk" "\0"|VALUE "InternalName", "${{ env.appname }}" "\0"|' ./flutter/windows/runner/Runner.rc
          sed -i -e 's|"rustdesk.exe"|"${{ env.filename }}"|' ./flutter/windows/runner/Runner.rc
          sed -i -e 's|"RustDesk"|"${{ env.appname }}"|' ./flutter/windows/runner/Runner.rc
          # ./src/lang/en.rs
          # change powered by rustdek to powered by compname
          if [ ! -z "${{ env.compname }}" ]; then
            find ./src/lang -name "*.rs" -exec sed -i '/powered_by_me/s|RustDesk|${{ env.compname }}|g' {} \;
          fi
          find ./src/lang -name "*.rs" -exec sed -i -e 's|RustDesk|${{ env.appname }}|' {} \;
          sed -i -e 's|RustDesk|${{ env.appname }}|' ./res/msi/Package/License.rtf

      - name: fix registry if appname has a space
        if: contains(env.appname, ' ')
        continue-on-error: true
        shell: bash
        run: |
          #./src/platform/windows.rs
          sed -i -e 's|reg add {}|reg add \\\"{}\\\"|' ./src/platform/windows.rs
          sed -i -e 's|reg add HKEY_CLASSES_ROOT\\\\.{ext} /f|reg add \\\"HKEY_CLASSES_ROOT\\\\.{ext}\\\" /f|' ./src/platform/windows.rs
          sed -i -e 's|reg add HKEY_CLASSES_ROOT\\\\.{ext}\\\\DefaultIcon /f|reg add \\\"HKEY_CLASSES_ROOT\\\\.{ext}\\\\DefaultIcon\\\" /f|' ./src/platform/windows.rs
          sed -i -e 's|reg add HKEY_CLASSES_ROOT\\\\.{ext}\\\\shell /f|reg add \\\"HKEY_CLASSES_ROOT\\\\.{ext}\\\\shell\\\" /f|' ./src/platform/windows.rs
          sed -i -e 's|reg add HKEY_CLASSES_ROOT\\\\.{ext}\\\\shell\\\\open /f|reg add \\\"HKEY_CLASSES_ROOT\\\\.{ext}\\\\shell\\\\open\\\" /f|' ./src/platform/windows.rs
          sed -i -e 's|reg add HKEY_CLASSES_ROOT\\\\.{ext}\\\\shell\\\\open\\\\command|reg add \\\"HKEY_CLASSES_ROOT\\\\.{ext}\\\\shell\\\\open\\\\command\\\"|' ./src/platform/windows.rs
          sed -i -e 's|reg add HKEY_CLASSES_ROOT\\\\{ext} /f|reg add \\\"HKEY_CLASSES_ROOT\\\\{ext}\\\" /f|' ./src/platform/windows.rs
          sed -i -e 's|reg add HKEY_CLASSES_ROOT\\\\{ext}\\\\shell /f|reg add \\\"HKEY_CLASSES_ROOT\\\\{ext}\\\\shell\\\" /f|' ./src/platform/windows.rs
          sed -i -e 's|reg add HKEY_CLASSES_ROOT\\\\{ext}\\\\shell\\\\open /f|reg add \\\"HKEY_CLASSES_ROOT\\\\{ext}\\\\shell\\\\open\\\" /f|' ./src/platform/windows.rs
          sed -i -e 's|reg add HKEY_CLASSES_ROOT\\\\{ext}\\\\shell\\\\open\\\\command /f|reg add \\\"HKEY_CLASSES_ROOT\\\\{ext}\\\\shell\\\\open\\\\command\\\" /f|' ./src/platform/windows.rs
          sed -i -e 's|{subkey}|\\\"{subkey}\\\"|' ./src/platform/windows.rs
          sed -i -e 's|reg delete HKEY_CLASSES_ROOT\\\\.{ext} /f|reg delete \\\"HKEY_CLASSES_ROOT\\\\.{ext}\\\" /f|' ./src/platform/windows.rs
          sed -i -e 's|reg delete HKEY_CLASSES_ROOT\\\\{ext} /f|reg delete \\\"HKEY_CLASSES_ROOT\\\\{ext}\\\" /f|' ./src/platform/windows.rs

      - name: change company name
        if: env.compname != 'Purslane Ltd'
        continue-on-error: true
        shell: bash
        run: |
          sed -i -e 's|Purslane Tech Pte. Ltd.|${{ env.compname }}|' ./flutter/lib/desktop/pages/desktop_setting_page.dart
          sed -i -e 's|Purslane Tech Pte. Ltd.|${{ env.compname }}|' ./res/msi/preprocess.py
          sed -i -e 's|r"Purslane(?: Tech Pte\\.)? Ltd"|"${{ env.compname }}"|' ./res/msi/preprocess.py
          sed -i -e 's|Purslane Tech Pte. Ltd.|${{ env.compname }}|' ./flutter/windows/runner/Runner.rc
          sed -i -e 's|Purslane Tech Pte. Ltd.|${{ env.compname }}|' ./Cargo.toml
          sed -i -e 's|Purslane Tech Pte. Ltd.|${{ env.compname }}|' ./libs/portable/Cargo.toml
          sed -i -e 's|Purslane Tech Pte. Ltd.|${{ env.compname }}|' ./res/msi/Package/License.rtf
          sed -i -e 's|Purslane Tech Pte. Ltd.|${{ env.compname }}|' ./src/main.rs
          sed -i -e 's|Purslane Ltd|${{ env.compname }}|' ./flutter/lib/desktop/pages/desktop_setting_page.dart
          sed -i -e 's|PURSLANE|${{ env.compname }}|' ./res/msi/preprocess.py
          sed -i -e 's|Purslane Ltd|${{ env.compname }}|' ./res/msi/preprocess.py
          sed -i -e 's|Purslane Ltd|${{ env.compname }}|' ./flutter/windows/runner/Runner.rc
          sed -i -e 's|Purslane Ltd|${{ env.compname }}|' ./Cargo.toml
          sed -i -e 's|Purslane Ltd|${{ env.compname }}|' ./libs/portable/Cargo.toml
          sed -i -e 's|Purslane Ltd|${{ env.compname }}|' ./res/msi/Package/License.rtf
          sed -i -e 's|Purslane Ltd|${{ env.compname }}|' ./src/main.rs

      - name: change url to custom
        if: env.urlLink != 'https://rustdesk.com'
        continue-on-error: true
        shell: bash
        run: |
          sed -i -e 's|Homepage: https://rustdesk.com|Homepage: ${{ env.urlLink }}|' ./build.py
          sed -i -e "s|launchUrl(Uri.parse('https://rustdesk.com'));|launchUrl(Uri.parse('${{ env.urlLink }}'));|" ./flutter/lib/common.dart
          sed -i -e "s|launchUrlString('https://rustdesk.com');|launchUrlString('${{ env.urlLink }}');|" ./flutter/lib/desktop/pages/desktop_setting_page.dart
          sed -i -e "s|launchUrlString('https://rustdesk.com/privacy.html')|launchUrlString('${{ env.urlLink }}/privacy.html')|" ./flutter/lib/desktop/pages/desktop_setting_page.dart
          sed -i -e "s|const url = 'https://rustdesk.com/';|const url = '${{ env.urlLink }}';|" ./flutter/lib/mobile/pages/settings_page.dart
          sed -i -e "s|launchUrlString('https://rustdesk.com/privacy.html')|launchUrlString('${{ env.urlLink }}/privacy.html')|" ./flutter/lib/mobile/pages/settings_page.dart
          sed -i -e "s|https://rustdesk.com/privacy.html|${{ env.urlLink }}/privacy.html|" ./flutter/lib/desktop/pages/install_page.dart
          sed -i -e "s|rustdesk.com|${{ env.urlLink }}|" ./res/msi/Package/License.rtf

      - name: change download link to custom
        if: env.downloadLink != 'https://rustdesk.com/download'
        continue-on-error: true
        shell: bash
        run: |
          sed -i -e 's|https://rustdesk.com/download|${{ env.downloadLink }}|' ./flutter/lib/desktop/pages/desktop_home_page.dart
          sed -i -e 's|https://rustdesk.com/download|${{ env.downloadLink }}|' ./flutter/lib/mobile/pages/connection_page.dart
          sed -i -e 's|https://rustdesk.com/download|${{ env.downloadLink }}|' ./src/ui/index.tis
          sed -i -e 's|&download_url|"${{ env.downloadLink }}"|' ./src/updater.rs
          sed -i -e 's|$downloadUrl/$downloadFile|${{ env.downloadLink }}|' ./flutter/lib/desktop/widgets/update_progress.dart

      - name: set server, serverPort, key, and apiserver
        continue-on-error: true
        shell: bash
        env:
          SERVER_DOMAIN: ${{ env.server }}
          SERVER_PORT_INPUT: ${{ env.serverPort }}
          SERVER_KEY: ${{ env.key }}
          API_SERVER: ${{ env.apiServer }}
        run: |
          # Pass secrets via bash env vars to avoid quoting issues
          if [ ! -f "./libs/hbb_common/src/config.rs" ]; then
            echo "Error: config.rs not found!"
            exit 1
          fi
          if [ ! -f "./src/common.rs" ]; then
            echo "Error: common.rs not found!"
            exit 1
          fi

          # Port must be a number; views.py defaults it to 21116
          if ! [[ "$SERVER_PORT_INPUT" =~ ^[0-9]+$ ]]; then
            echo "Error: serverPort must be a number, got: '$SERVER_PORT_INPUT'"
            exit 1
          fi

          # Derive the port block from the rendezvous port
          # (defaults 21116/21117/21118/21119)
          SERVER_PORT=$SERVER_PORT_INPUT
          RELAY_PORT=$((SERVER_PORT + 1))
          WS_RENDEZVOUS_PORT=$((RELAY_PORT + 1))
          WS_RELAY_PORT=$((WS_RENDEZVOUS_PORT + 1))

          echo "Setting server: $SERVER_DOMAIN"
          echo "Setting ports: $SERVER_PORT, $RELAY_PORT, $WS_RENDEZVOUS_PORT, $WS_RELAY_PORT"

          sed -i -e "s|rs-ny.rustdesk.com|$SERVER_DOMAIN|" ./libs/hbb_common/src/config.rs

          # Match on numeric value so the step is independent of defaults
          sed -i -e "s|pub const RENDEZVOUS_PORT: i32 = [0-9][0-9]*;|pub const RENDEZVOUS_PORT: i32 = $SERVER_PORT;|" ./libs/hbb_common/src/config.rs
          sed -i -e "s|pub const RELAY_PORT: i32 = [0-9][0-9]*;|pub const RELAY_PORT: i32 = $RELAY_PORT;|" ./libs/hbb_common/src/config.rs
          sed -i -e "s|pub const WS_RENDEZVOUS_PORT: i32 = [0-9][0-9]*;|pub const WS_RENDEZVOUS_PORT: i32 = $WS_RENDEZVOUS_PORT;|" ./libs/hbb_common/src/config.rs
          sed -i -e "s|pub const WS_RELAY_PORT: i32 = [0-9][0-9]*;|pub const WS_RELAY_PORT: i32 = $WS_RELAY_PORT;|" ./libs/hbb_common/src/config.rs

          sed -i -e "s|OeVuKk5nlHiXp+APNn0Y3pC1Iwpwn44JGqrQCsWqmBw=|$SERVER_KEY|" ./libs/hbb_common/src/config.rs
          sed -i -e "s|https://admin.rustdesk.com|$API_SERVER|" ./src/common.rs

          echo "=== Verification ==="
          grep -nE "RENDEZVOUS_PORT|RELAY_PORT|WS_" ./libs/hbb_common/src/config.rs
          # ./flutter/pubspec.yaml
          #sed -i '/intl:/a \ \ archive: ^3.6.1' ./flutter/pubspec.yaml

      - name: allow custom.txt
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          shell: pwsh
          command: |
            Invoke-WebRequest -Uri https://raw.githubusercontent.com/bryangerlach/rdgen/refs/heads/master/.github/patches/allowCustom.py -OutFile allowCustom.py
            python allowCustom.py
            # Remove Setup Server Tip
            Invoke-WebRequest -Uri https://raw.githubusercontent.com/bryangerlach/rdgen/refs/heads/master/.github/patches/removeSetupServerTip.diff -OutFile removeSetupServerTip.diff
            git apply removeSetupServerTip.diff

      - name: Patch remote printer port to spool file
        shell: python
        run: |
          import glob, os, sys

          # GL!TCH printer patch, run from the RustDesk source root before the build.
          #  1. The printer prints to C:\ProgramData\<app>\printer-spool\job.prn, the file the open
          #     printer adapter reads (Rust side, and the MSI's InstallPrinter custom action).
          #  2. The MSI removes hidden leftover copies of the printer that a reinstall leaves behind.
          #  3. The MSI installs Microsoft's VC++ runtime (merge module), which the printer driver's
          #     render filter needs.
          #  4. The MSI sets the Ctrl+Alt+Del policy without starting reg.exe (antivirus flagged it).
          # Any step that no longer matches the RustDesk source stops the build: a build without it
          # installs a printer that silently prints nothing.

          src = "."
          app = os.environ.get("appname") or "RustDesk"
          failed = []

          def patch(path, label, pairs):
              if not os.path.isfile(path):
                  failed.append("%s: %s not found" % (label, path))
                  return
              with open(path, "r", encoding="utf-8-sig") as f:
                  t = f.read()
              if "GL!TCH" in t:
                  print("%s: already patched" % label)
                  return
              for old, new in pairs:
                  if t.count(old) != 1:
                      failed.append("%s: expected text found %d times: %r" % (label, t.count(old), old[:80]))
                      return
                  t = t.replace(old, new, 1)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(t)
              print("%s: patched" % label)

          # 1a. Rust (the app installing its printer itself from its settings)
          patch(os.path.join(src, "libs", "remote_printer", "src", "lib.rs"), "Rust printer port", [(
              'fn get_port_name(app_name: &str) -> Vec<u16> {\n'
              '    format!("{} Printer", app_name)',
              'fn get_port_name(app_name: &str) -> Vec<u16> {\n'
              '    // GL!TCH: print to the file the open printer adapter reads\n'
              '    let base = std::env::var("ProgramData")\n'
              '        .unwrap_or_else(|_| "C:\\\\ProgramData".to_string());\n'
              '    let dir = format!("{}\\\\{}\\\\printer-spool", base, app_name);\n'
              '    let _ = std::fs::create_dir_all(&dir);\n'
              '    format!("{}\\\\job.prn", dir)',
          )])

          # 1b + 2. MSI custom action
          HELPERS = r'''
              // GL!TCH: the printer prints to this file; the open printer adapter reads it
              static std::wstring spoolPortOf(const std::wstring &appName, bool create)
              {
                  wchar_t base[MAX_PATH] = {0};
                  DWORD n = GetEnvironmentVariableW(L"ProgramData", base, MAX_PATH);
                  std::wstring dir = (n > 0 && n < MAX_PATH) ? std::wstring(base) : std::wstring(L"C:\\ProgramData");
                  dir += L"\\" + (appName.empty() ? std::wstring(RD_DEFAULT_APP_NAME) : appName);
                  if (create) CreateDirectoryW(dir.c_str(), NULL);
                  dir += L"\\printer-spool";
                  if (create) CreateDirectoryW(dir.c_str(), NULL);
                  return dir + L"\\job.prn";
              }

              // GL!TCH: Windows keeps a deleted printer as a hidden device, and the Windows 11 print
              // dialog can still list it, so every reinstall showed one more printer. Remove the hidden
              // (not present) print queues of our driver; present ones are left alone.
              static void removeHiddenQueues()
              {
                  static const GUID printQueueClass = {0x1ed2bbf9, 0x11f0, 0x4084, {0xb2, 0x1f, 0xad, 0x83, 0xa8, 0xe6, 0xdc, 0xdc}};
                  const wchar_t *driverHwid = L"PRINTENUM\\{1217A442-8AF3-472E-A347-161FC1B3DB22}";
                  HDEVINFO devs = SetupDiGetClassDevsW(&printQueueClass, NULL, NULL, 0);
                  if (devs == INVALID_HANDLE_VALUE)
                  {
                      return;
                  }
                  std::vector<SP_DEVINFO_DATA> hidden;
                  SP_DEVINFO_DATA dev;
                  dev.cbSize = sizeof(SP_DEVINFO_DATA);
                  for (DWORD i = 0; SetupDiEnumDeviceInfo(devs, i, &dev); i++)
                  {
                      ULONG status = 0, problem = 0;
                      if (CM_Get_DevNode_Status(&status, &problem, dev.DevInst, 0) != CR_NO_SUCH_DEVINST)
                      {
                          continue;
                      }
                      wchar_t ids[2048] = {0};
                      if (!SetupDiGetDeviceRegistryPropertyW(devs, &dev, SPDRP_HARDWAREID, NULL, (PBYTE)ids, (DWORD)(sizeof(ids) - 2 * sizeof(wchar_t)), NULL))
                      {
                          continue;
                      }
                      for (const wchar_t *p = ids; *p; p += wcslen(p) + 1)
                      {
                          if (_wcsicmp(p, driverHwid) == 0)
                          {
                              hidden.push_back(dev);
                              break;
                          }
                      }
                  }
                  for (auto &d : hidden)
                  {
                      if (SetupDiRemoveDevice(devs, &d))
                      {
                          WcaLog(LOGMSG_STANDARD, "Removed a hidden copy of the printer\n");
                      }
                  }
                  SetupDiDestroyDeviceInfoList(devs);
              }
          '''

          patch(os.path.join(src, "res", "msi", "CustomActions", "RemotePrinter.cpp"), "MSI printer", [
              ('#pragma comment(lib, "setupapi.lib")\n',
               '#pragma comment(lib, "setupapi.lib")\n'
               '#include <cfgmgr32.h>\n'
               '#pragma comment(lib, "cfgmgr32.lib") // GL!TCH\n'),
              ('        return (appName.empty() ? std::wstring(RD_DEFAULT_APP_NAME) : appName) + L" Printer";\n'
               '    }\n',
               '        return (appName.empty() ? std::wstring(RD_DEFAULT_APP_NAME) : appName) + L" Printer";\n'
               '    }\n' + HELPERS),
              ('        const LPCWCH RD_PRINTER_PORT = printerName.c_str();\n',
               '        const std::wstring printerPort = spoolPortOf(appName, true);\n'
               '        const LPCWCH RD_PRINTER_PORT = printerPort.c_str();\n'),
              ('        if (FALSE == addPrinter(RD_PRINTER_NAME, RD_PRINTER_DRIVER_NAME, RD_PRINTER_PORT))\n',
               '        removeHiddenQueues();\n\n'
               '        if (FALSE == addPrinter(RD_PRINTER_NAME, RD_PRINTER_DRIVER_NAME, RD_PRINTER_PORT))\n'),
              ('        checkDeleteLocalPort(printerName.c_str());\n',
               '        checkDeleteLocalPort(printerName.c_str());\n'
               '        checkDeleteLocalPort(spoolPortOf(appName, false).c_str());\n'
               '        removeHiddenQueues();\n'),
          ])

          # 3. VC++ runtime merge module from the runner's Visual Studio
          msms = sorted(glob.glob(r"C:\Program Files\Microsoft Visual Studio\2022\*\VC\Redist\MSVC\*\MergeModules\Microsoft_VC14*_CRT_x64.msm"))
          if not msms:
              failed.append("VC++ runtime: no Microsoft_VC14*_CRT_x64.msm on this runner")
          else:
              msm = msms[-1]
              print("VC++ runtime merge module: %s" % msm)
              patch(os.path.join(src, "res", "msi", "Package", "Package.wxs"), "MSI VC++ runtime", [
                  ('\t\t<Feature Id="App" ',
                   '\t\t<!-- GL!TCH: the printer driver needs the VC++ runtime -->\n'
                   '\t\t<StandardDirectory Id="TARGETDIR">\n'
                   '\t\t\t<Merge Id="VCRedist" SourceFile="%s" DiskId="1" Language="0" />\n'
                   '\t\t</StandardDirectory>\n\n'
                   '\t\t<Feature Id="App" ' % msm),
                  ('\t\t\t<ComponentGroupRef Id="Components" />\n',
                   '\t\t\t<ComponentGroupRef Id="Components" />\n'
                   '\t\t\t<MergeRef Id="VCRedist" />\n'),
              ])

          # 4. The MSI's last step set SoftwareSASGeneration (lets the service send Ctrl+Alt+Del) by
          #    starting "reg add HKLM\...\Policies\System" as SYSTEM, which antivirus flags (Avast
          #    IDP.HELU.PSE95). Write the value directly instead; upstream's direct write passed the
          #    number 1 as a pointer, which is why it always failed and the reg.exe call was added.
          patch(os.path.join(src, "res", "msi", "CustomActions", "CustomActions.cpp"), "MSI Ctrl+Alt+Del setting", [
              ('    HINSTANCE hi = 0;\n\n    hr = WcaInitialize(hInstall, "AddRegSoftwareSASGeneration");\n',
               '    hr = WcaInitialize(hInstall, "AddRegSoftwareSASGeneration");\n'),
              ('    hi = ShellExecuteW(NULL, L"open", L"reg", L" add HKEY_LOCAL_MACHINE\\\\Software\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Policies\\\\System /f /v SoftwareSASGeneration /t REG_DWORD /d 1", NULL, SW_HIDE);\n'
               '    // https://learn.microsoft.com/en-us/windows/win32/api/shellapi/nf-shellapi-shellexecutew\n'
               '    if ((int)hi <= 32) {\n'
               '        WcaLog(LOGMSG_STANDARD, "Failed to add registry name \\"%ls\\", %d, %d", valueName, (int)hi, GetLastError());\n'
               '    }\n'
               '    else {\n'
               '        WcaLog(LOGMSG_STANDARD, "Registry name \\"%ls\\" is added", valueName);\n'
               '    }\n',
               '    // GL!TCH: no reg.exe command line (antivirus flags it); the value is written directly below\n'),
              ('    result = RegCreateKeyExW(HKEY_LOCAL_MACHINE, subKey, 0, NULL, REG_OPTION_NON_VOLATILE, KEY_WRITE, NULL, &hKey, NULL);\n',
               '    result = RegCreateKeyExW(HKEY_LOCAL_MACHINE, subKey, 0, NULL, REG_OPTION_NON_VOLATILE, KEY_WRITE | KEY_WOW64_64KEY, NULL, &hKey, NULL);\n'),
              ('    result = RegSetValueExW(hKey, valueName, 0, valueType, reinterpret_cast<const BYTE*>(valueData), valueDataSize);\n',
               '    result = RegSetValueExW(hKey, valueName, 0, valueType, reinterpret_cast<const BYTE*>(&valueData), valueDataSize);\n'),
          ])

          if failed:
              print("GL!TCH printer patch FAILED - the RustDesk source changed; update this step:")
              for f in failed:
                  print("  " + f)
              sys.exit(1)

      - name: Patch default view style to Adaptive
        shell: python
        run: |
          # GL!TCH: desktop builds default a new connection's view style to "original" (no
          # scaling); every GlitchTech/GlitchConnect session then needs a tech to switch it
          # to Adaptive by hand. Mobile already defaults to "adaptive" - make desktop match.
          path = "libs/hbb_common/src/config.rs"
          old = (
              '#[cfg(not(any(target_os = "android", target_os = "ios")))]\n'
              '            keys::OPTION_VIEW_STYLE => self.get_string(key, "original", vec!["adaptive"]),'
          )
          new = (
              '#[cfg(not(any(target_os = "android", target_os = "ios")))]\n'
              '            keys::OPTION_VIEW_STYLE => self.get_string(key, "adaptive", vec!["original"]), // GL!TCH: default to Adaptive'
          )
          with open(path, "r", encoding="utf-8") as f:
              t = f.read()
          if "GL!TCH: default to Adaptive" in t:
              print("view style default: already patched")
          elif t.count(old) == 1:
              with open(path, "w", encoding="utf-8") as f:
                  f.write(t.replace(old, new, 1))
              print("view style default: patched to Adaptive")
          else:
              print("view style default FAILED - expected text found %d times, RustDesk source changed; update this step" % t.count(old))
              raise SystemExit(1)

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v1
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@v2.12.0 #https://github.com/subosito/flutter-action/issues/277
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # https://github.com/flutter/flutter/issues/155685
      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ matrix.job.os }}

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.job.vcpkg-triplet }}
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet ${{ matrix.job.vcpkg-triplet }} \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log" || true
        shell: bash

      - name: magick stuff
        if: ${{ env.iconlink_url != 'false' }}
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          shell: pwsh
          command: |
            Invoke-WebRequest -Uri ${{ env.iconlink_url }}/get_png?filename=${{ env.iconlink_file }}"&"uuid=${{ env.iconlink_uuid }} -OutFile ./res/iconx.png
            mv ./res/icon.ico ./res/icon.ico.bak
            mv ./res/icon.png ./res/icon.png.bak
            mv ./res/tray-icon.ico ./res/tray-icon.ico.bak
            mv ./res/iconx.png ./res/icon.png
            mv ./res/32x32.png ./res/32x32.png.bak
            mv ./res/64x64.png ./res/64x64.png.bak
            mv ./res/128x128.png ./res/128x128.png.bak
            mv ./res/128x128@2x.png ./res/128x128@2x.png.bak
            # every size Windows asks for at 100-200% scaling, so it never rescales on the fly
            magick ./res/icon.png -define icon:auto-resize=256,128,96,64,48,40,32,24,20,16 ./res/icon.ico
            # the tray decodes the largest entry of this file, so keep it a single 32x32 like upstream
            # (a 256 entry here is shrunk to 16-24 px by the shell and comes out jagged)
            magick ./res/icon.png -resize 32x32 ./res/tray-icon.ico
            magick ./res/icon.png -resize 32x32 ./res/32x32.png
            magick ./res/icon.png -resize 64x64 ./res/64x64.png
            magick ./res/icon.png -resize 128x128 ./res/128x128.png
            magick ./res/icon.png -resize 256x256 ./res/128x128@2x.png


      - name: ui.rs icon
        if: ${{ env.iconlink_url != 'false' }}
        continue-on-error: true
        shell: bash
        run: |
          cp ./src/ui.rs ./src/ui.rs.bak
          b64=$(base64 -w0 < ./res/icon.png)
          perl -0777 -pe "s|iVBORw0KGgoAAAANSUhEUgAAAIAAAACACAYAAADDPmHL[A-Za-z0-9+/=]+|$b64|g" -i.bak ./src/ui.rs
          b64=""

      - name: fix connection delay
        continue-on-error: true
        if: ${{ env.delayFix == 'true' }}
        shell: bash
        run: |
          # Precise fix: only extend the direct-connection condition with the
          # key check, instead of globally replacing !key.is_empty() with
          # false (which would also disable TCP encryption and UDP logic).
          sed -i -e 's#if is_local || peer_nat_type == NatType::SYMMETRIC {#if is_local || peer_nat_type == NatType::SYMMETRIC || !key.is_empty() {#' ./src/client.rs
          grep -n "key.is_empty()" ./src/client.rs || true

      - name: use X for offline display instead of orange circle
        if: env.xOffline == 'true'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          shell: pwsh
          continue_on_error: true
          command: |
            Invoke-WebRequest -Uri https://raw.githubusercontent.com/bryangerlach/rdgen/refs/heads/master/.github/patches/xoffline.diff -OutFile xoffline.diff
            git apply xoffline.diff

      - name: removeNewVersionNotif
        continue-on-error: true
        if: env.removeNewVersionNotif == 'true'
        shell: bash
        run: |
          sed -i -e 's|updateUrl.isNotEmpty|false|' ./flutter/lib/desktop/pages/desktop_home_page.dart
          sed -i '/let (request, url) =/,/Ok(())/{/Ok(())/!d}' ./src/common.rs

      # - name: run as admin
      #   continue-on-error: true
      #   if: ${{ env.runasadmin == 'true' }}
      #   shell: bash
      #   run: |
      #     sed -i '/<\/compatibility>/a \
      #           <security> \
      #             <requestedExecutionLevel level="requireAdministrator" uiAccess="false"/> \
      #           </security>' ./flutter/windows/runner/runner.exe.manifest

      - name: replace flutter icons
        if: ${{ env.iconlink_url != 'false' }}
        continue-on-error: true
        run: |
          cd ./flutter
          #flutter pub upgrade win32
          flutter pub get
          flutter pub run flutter_launcher_icons
          # flutter_launcher_icons writes app_icon.ico with a single 48x48 image, which the taskbar,
          # the exe and the shortcuts then rescale; use the multi-size icon instead
          cp ../res/icon.ico ./windows/runner/resources/app_icon.ico
          cd ..

      - name: Checkout printer-adapter crate
        uses: actions/checkout@v4
        with:
          repository: bryangerlach/rdgen
          ref: master
          path: ./temp-repo

      - name: Move printer-adapter into place
        shell: pwsh
        run: |
          if (Test-Path "./temp-repo/printer-adapter") {
            Move-Item -Path "./temp-repo/printer-adapter" -Destination "./printer-adapter" -Force
            Remove-Item -Recurse -Force "./temp-repo"
            Write-Host "Successfully placed printer-adapter into workspace."
          } else {
            Write-Host "Error: printer-adapter folder not found in repository."
          }

      - name: Build rustdesk
        run: |
          # Windows: build RustDesk
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec ${{ matrix.job.build-args }}
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk

          # Download usbmmidd_v2.zip and extract it to ./rustdesk
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath . -Force
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

          # Download and install driver package
          try {
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip
            Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath .
            mkdir ./rustdesk/drivers -ErrorAction SilentlyContinue
            mv -Force .\rustdesk_printer_driver_v4-1.4 ./rustdesk/drivers/RustDeskPrinterDriver
          } catch {
            Write-Host "Warning: Printer driver download failed."
          }

          # Build and install open printer adapter
          if (Test-Path "./printer-adapter/Cargo.toml") {
            Write-Host "Building open printer-adapter..."
            pushd ./printer-adapter
            cargo build --release --locked
            popd
            if (Test-Path "./printer-adapter/target/release/printer_driver_adapter.dll") {
              cp -Force "./printer-adapter/target/release/printer_driver_adapter.dll" "./rustdesk/printer_driver_adapter.dll"
              Write-Host "Replaced printer_driver_adapter.dll with open implementation."
            } else {
              Write-Host "Error: printer-adapter build succeeded but DLL was not found."
            }
          } else {
            Write-Host "Warning: ./printer-adapter/Cargo.toml not found, remote printing will remain disabled."
          }

      - name: icon stuff
        if: ${{ env.iconlink_url != 'false' }}
        continue-on-error: true
        run: |
          mv ./rustdesk/data/flutter_assets/assets/icon.svg ./rustdesk/data/flutter_assets/assets/icon.svg.bak
          magick ./res/icon.png ./rustdesk/data/flutter_assets/assets/icon.svg
          # assets/icon.png is loaded before icon.svg (which above only wraps the 256 px png) by the
          # title bar (16 px), the connection manager (30 px) and the tray; 48 px serves all three
          # with at most a 3x downscale. icon.ico is picked up for the shortcuts.
          magick ./res/icon.png -resize 48x48 ./rustdesk/data/flutter_assets/assets/icon.png
          cp ./res/icon.ico ./rustdesk/data/flutter_assets/assets/icon.ico

      - name: logo stuff
        if: ${{ env.logolink_url != 'false' }}
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          shell: pwsh
          continue_on_error: true
          command: |
            Invoke-WebRequest -Uri ${{ env.logolink_url }}/get_png?filename=${{ env.logolink_file }}"&"uuid=${{ env.logolink_uuid }} -OutFile ./rustdesk/data/flutter_assets/assets/logo.png

      - name: find Runner.res
        # Windows: find Runner.res (compiled from ./flutter/windows/runner/Runner.rc), copy to ./Runner.res
        # Runner.rc does not contain actual version, but Runner.res does
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res");
          if [ "$runner_res" == "" ]; then
            echo "Runner.res: not found";
          else
            echo "Runner.res: $runner_res";
            cp $runner_res ./libs/portable/Runner.res;
            echo "list ./libs/portable/Runner.res";
            ls -l ./libs/portable/Runner.res;
          fi

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@master
        if: env.UPLOAD_ARTIFACT == 'true'
        with:
          name: topmostwindow-artifacts
          path: "./rustdesk"

      - name: sign dlls and exe (Artifact Signing)
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: glitch-signing
          certificate-profile-name: GlitchRemote
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          files-folder: ${{ github.workspace }}/rustdesk
          files-folder-filter: dll,exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: zip dlls
        continue-on-error: true
        shell: pwsh
        run: |
          Compress-Archive -Path ./rustdesk/*.dll, ./rustdesk/*.exe -DestinationPath ./rustdesk/unsigned_files.zip -CompressionLevel Fastest

      - name: sign dlls
        continue-on-error: true
        shell: bash
        run: |
          if [ ! -z "${{ secrets.SIGN_BASE_URL }}" ] && [ ! -z "${{ secrets.SIGN_API_KEY }}" ]; then
            curl -X POST -F "file=@./rustdesk/unsigned_files.zip" \
              -H "X-API-KEY: ${{ secrets.SIGN_API_KEY }}" \
              -m 900 \
              "${{ secrets.SIGN_BASE_URL }}/sign/" -o ./rustdesk/signed_files.zip
          else
            echo "Signing skipped - signing URL or API key not configured"
            cp ./rustdesk/unsigned_files.zip ./rustdesk/signed_files.zip
          fi

      - name: unzip dlls
        continue-on-error: true
        shell: pwsh
        run: |
          Expand-Archive -Path ./rustdesk/signed_files.zip -DestinationPath ./rustdesk/ -Force
          Remove-Item ./rustdesk/unsigned_files.zip
          Remove-Item ./rustdesk/signed_files.zip

      - name: Create custom.txt file
        shell: bash
        run: |
          echo -n "${{ env.custom }}" | cat > ./rustdesk/custom_.txt

      - name: Build self-extracted executable
        shell: bash
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          mv "./rustdesk/rustdesk.exe" "./rustdesk/${{ env.appname }}.exe" || echo "rustdesk.exe"
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e "../../rustdesk/${{ env.appname }}.exe"
          popd
          mkdir -p ./SignOutput
          mv ./target/release/rustdesk-portable-packer.exe "./SignOutput/rustdesk.exe"

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build msi
        continue-on-error: true
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          $myappname = "${{ env.appname }}" -replace '\s','_'
          cp "rustdesk/${{ env.appname }}.exe" "rustdesk/${myappname}.exe" -ErrorAction SilentlyContinue
          pushd ./res/msi
          python preprocess.py --app-name "$myappname" --arp -d ../../rustdesk
          # GL!TCH: keep the internal name (folder/service/exe) as-is but show a spaced label on the
          # Desktop/Start Menu shortcut, e.g. GlitchHost -> "Glitch Host"
          if ($myappname -match '^glitch') {
            $displayname = ($myappname -replace '_',' ') -creplace '(?<=[a-z])(?=[A-Z])',' '
            @'
          import glob, re, sys
          disp = sys.argv[1]
          for f in glob.glob("Package/Language/*.wxl"):
              t = open(f, encoding="utf-8").read()
              t2 = re.sub(r'(<String Id="SC_Client" Value=")[^"]*(")', lambda m: m.group(1) + disp + m.group(2), t)
              if t2 != t:
                  open(f, "w", encoding="utf-8").write(t2)
          print("shortcut label set to '" + disp + "'")
          '@ | Set-Content -Path glitch_shortcut.py -Encoding utf8
            python glitch_shortcut.py "$displayname"
          }
          # GL!TCH: install the remote printer by default on Host builds (RustDesk ships it unchecked)
          if ($myappname -match '^glitch.*host') {
            @'
          p = "Package/Fragments/ShortcutProperties.wxs"
          b = open(p, "rb").read()
          old = b'<Property Id="PRINTER" Secure="yes"></Property>'
          new = b'<Property Id="PRINTER" Value="1" Secure="yes"></Property>'
          if b.count(old) == 1:
              open(p, "wb").write(b.replace(old, new, 1))
              print("PRINTER now defaults to installed")
          else:
              print("WARNING: PRINTER default line not found; printer stays optional")
          '@ | Set-Content -Path glitch_printer.py -Encoding utf8
            python glitch_printer.py
          }
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          cp ./Package/bin/x64/Release/en-us/Package.msi ../../SignOutput/rustdesk-latest.msi
          mv ./Package/bin/x64/Release/en-us/Package.msi ../../SignOutput/rustdesk.msi
          sha256sum ../../SignOutput/rustdesk.msi

      - name: sign exe and msi (Artifact Signing)
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: glitch-signing
          certificate-profile-name: GlitchRemote
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          files-folder: ${{ github.workspace }}/SignOutput
          files-folder-filter: exe,msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: zip exe and msi
        continue-on-error: true
        shell: pwsh
        run: |
          Compress-Archive -Path ./SignOutput/*.exe, ./SignOutput/*.msi -DestinationPath ./SignOutput/unsigned_files.zip -CompressionLevel Fastest

      - name: sign exe and msi
        continue-on-error: true
        shell: bash
        run: |
          if [ ! -z "${{ secrets.SIGN_BASE_URL }}" ] && [ ! -z "${{ secrets.SIGN_API_KEY }}" ]; then
            curl -X POST -F "file=@./SignOutput/unsigned_files.zip" \
              -H "X-API-KEY: ${{ secrets.SIGN_API_KEY }}" \
              -m 900 \
              "${{ secrets.SIGN_BASE_URL }}/sign/" -o ./SignOutput/signed_files.zip
          else
            echo "Signing skipped - signing URL or API key not configured"
            cp ./SignOutput/unsigned_files.zip ./SignOutput/signed_files.zip
          fi

      - name: unzip exe and msi
        continue-on-error: true
        shell: pwsh
        run: |
          Expand-Archive -Path ./SignOutput/signed_files.zip -DestinationPath ./SignOutput/ -Force
          Remove-Item ./SignOutput/unsigned_files.zip
          Remove-Item ./SignOutput/signed_files.zip

      - name: rename rustdesk.exe to filename.exe
        run: |
          mv ./SignOutput/rustdesk.exe "./SignOutput/${{ env.filename }}.exe" || echo "rustdesk"

      - name: rename rustdesk.msi to filename.msi
        continue-on-error: true
        run: |
          mv ./SignOutput/rustdesk.msi "./SignOutput/${{ env.filename }}.msi" || echo "rustdesk"

      - name: Build GlitchHost install-link MSI (host-msi.ps1)
        if: env.appname == 'GlitchHost'
        shell: pwsh
        run: |
          # GL!TCH: the /host and /h/{link} install-link flow serves a separate
          # GlitchHost-host.msi with a one-time-code placeholder the server swaps
          # in at download time. Inlined (not a checked-in script) because the
          # later "Checkout source code" step overwrites this workspace with the
          # upstream rustdesk/rustdesk repo, wiping any files not tracked there.
          $Placeholder = 'GLH-CODE-PLACEHOLDER-' + ('X' * 27)   # 48 characters, the length of a code
          $In = (Resolve-Path "./SignOutput/${{ env.filename }}.msi").Path
          $Out = Join-Path (Split-Path $In) "${{ env.filename }}-host.msi"
          Copy-Item $In $Out -Force
          $Out = (Resolve-Path $Out).Path

          $wi = New-Object -ComObject WindowsInstaller.Installer
          $db = $wi.GetType().InvokeMember('OpenDatabase', 'InvokeMethod', $null, $wi, @($Out, 1))
          function Run($sql, [object[]]$params) {
              $v = $db.GetType().InvokeMember('OpenView', 'InvokeMethod', $null, $db, @($sql))
              $rec = $null
              if ($params) {
                  $rec = $wi.GetType().InvokeMember('CreateRecord', 'InvokeMethod', $null, $wi, @($params.Count))
                  for ($k = 0; $k -lt $params.Count; $k++) {
                      $prop = if ($params[$k] -is [int]) { 'IntegerData' } else { 'StringData' }
                      $rec.GetType().InvokeMember($prop, 'SetProperty', $null, $rec, @(($k + 1), $params[$k]))
                  }
              }
              $v.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $v, @($rec)) | Out-Null
              $r = if ($sql -like 'SELECT*') { $v.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $v, $null) }
              $v.GetType().InvokeMember('Close', 'InvokeMethod', $null, $v, $null) | Out-Null
              [Runtime.InteropServices.Marshal]::ReleaseComObject($v) | Out-Null
              , $r
          }
          function One($sql) { $r = Run $sql; if ($r) { $r.GetType().InvokeMember('StringData', 'GetProperty', $null, $r, 1) } }

          if (One "SELECT Action FROM CustomAction WHERE Action='GlitchJoinGroup'") { throw 'This MSI is already patched.' }
          if (-not (One "SELECT File FROM File WHERE File='App.exe'")) { throw 'GlitchHost.exe (File App.exe) not found; not patching.' }
          $start = [int](One "SELECT Sequence FROM InstallExecuteSequence WHERE Action='CreateStartService'")
          $fin = [int](One "SELECT Sequence FROM InstallExecuteSequence WHERE Action='InstallFinalize'")
          if (-not $start -or $start -ge $fin) { throw 'CreateStartService / InstallFinalize not where expected; not patching.' }

          # InstallFinalize and everything after it move up by 10, so the new step fits right before it.
          $v = $db.GetType().InvokeMember('OpenView', 'InvokeMethod', $null, $db, @("SELECT Action, Sequence FROM InstallExecuteSequence"))
          $v.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $v, $null) | Out-Null
          $late = @()
          while ($r = $v.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $v, $null)) {
              $s = [int]$r.GetType().InvokeMember('IntegerData', 'GetProperty', $null, $r, 2)
              if ($s -ge $fin) { $late += , @($r.GetType().InvokeMember('StringData', 'GetProperty', $null, $r, 1), $s) }
          }
          $v.GetType().InvokeMember('Close', 'InvokeMethod', $null, $v, $null) | Out-Null
          [Runtime.InteropServices.Marshal]::ReleaseComObject($v) | Out-Null
          foreach ($a in $late) { Run "UPDATE InstallExecuteSequence SET Sequence=$($a[1] + 10) WHERE Action='$($a[0])'" | Out-Null }

          Run 'INSERT INTO `Property` (`Property`, `Value`) VALUES (?, ?)' @('GLITCHHOSTCODE', $Placeholder) | Out-Null
          # 3154 = run an installed exe (18), ignore its exit code (64), deferred (1024), as SYSTEM (2048)
          Run 'INSERT INTO `CustomAction` (`Action`, `Type`, `Source`, `Target`) VALUES (?, ?, ?, ?)' @('GlitchJoinGroup', 3154, 'App.exe', '--assign --token [GLITCHHOSTCODE] --note GlitchHost') | Out-Null
          Run 'INSERT INTO `InstallExecuteSequence` (`Action`, `Condition`, `Sequence`) VALUES (?, ?, ?)' @('GlitchJoinGroup', 'GLITCHHOSTCODE AND NOT (REMOVE="ALL")', $fin) | Out-Null
          $db.GetType().InvokeMember('Commit', 'InvokeMethod', $null, $db, $null) | Out-Null
          [Runtime.InteropServices.Marshal]::ReleaseComObject($db) | Out-Null
          [Runtime.InteropServices.Marshal]::ReleaseComObject($wi) | Out-Null
          [GC]::Collect(); [GC]::WaitForPendingFinalizers(); [GC]::Collect()

          # The server swaps the placeholder bytes in place: it must be in the file exactly once, in one piece.
          $bytes = $null
          for ($i = 0; $i -lt 10; $i++) {
              try { $bytes = [IO.File]::ReadAllBytes($Out); break }
              catch { Start-Sleep -Milliseconds 500 }
          }
          if (-not $bytes) { throw "Could not read $Out after retries - file still locked" }
          $text = [Text.Encoding]::GetEncoding('ISO-8859-1').GetString($bytes)
          $count = ([regex]::Matches($text, [regex]::Escape($Placeholder))).Count
          Write-Output "placeholder found $count time(s) in one piece"
          if ($count -ne 1) { throw "Expected placeholder exactly once, found $count - RustDesk source or MSI layout changed; update this step" }
          Write-Output "written: $Out"

      - name: sign GlitchHost-host.msi (Artifact Signing)
        if: env.appname == 'GlitchHost'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: glitch-signing
          certificate-profile-name: GlitchRemote
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          files-folder: ${{ github.workspace }}/SignOutput
          files-folder-filter: msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: send file to rdgen server
        if: ${{ env.rdgen == 'true' }}
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          shell: bash
          command: |
            curl -i -X POST -H "Content-Type: multipart/form-data" -H "Authorization: Bearer ${{ env.token }}" -F "file=@./SignOutput/${{ env.filename }}.exe" -F "uuid=${{ env.uuid }}" ${{ secrets.GENURL }}/save_custom_client
            curl -i -X POST -H "Content-Type: multipart/form-data" -H "Authorization: Bearer ${{ env.token }}" -F "file=@./SignOutput/${{ env.filename }}.msi" -F "uuid=${{ env.uuid }}" ${{ secrets.GENURL }}/save_custom_client || true
            if [ -f "./SignOutput/${{ env.filename }}-host.msi" ]; then
              curl -i -X POST -H "Content-Type: multipart/form-data" -H "Authorization: Bearer ${{ env.token }}" -F "file=@./SignOutput/${{ env.filename }}-host.msi" -F "uuid=${{ env.uuid }}" ${{ secrets.GENURL }}/save_custom_client || true
            fi

      - name: send file to api server
        if: ${{ env.rdgen == 'false' }}
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          shell: bash
          command: |
            curl -i -X POST -H "Content-Type: multipart/form-data" -H "Authorization: Bearer ${{ env.token }}" -F "file=@./SignOutput/${{ env.filename }}.exe" ${{ env.apiServer }}/api/save_custom_client
            curl -i -X POST -H "Content-Type: multipart/form-data" -H "Authorization: Bearer ${{ env.token }}" -F "file=@./SignOutput/${{ env.filename }}.msi" ${{ env.apiServer }}/api/save_custom_client || true

  cleanup:
    needs: [build-for-windows-flutter]
    runs-on: ubuntu-latest
    continue-on-error: true
    if: always()
    steps:
      - name: Delete secrets artifact
        uses: geekyeggo/delete-artifact@v5
        with:
          name: encrypted-secrets-zip
