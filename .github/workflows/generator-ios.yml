name: Custom iOS Client Generator
run-name: ${{ inputs.label && format('{0} - {1}', 'iOS', inputs.label) || 'Custom iOS Client Generator' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'rustdesk ref to build (git tag, or "master")'
        required: true
        default: 'master'
        type: string
      appname:
        description: 'app display name'
        required: true
        default: 'GlitchConnect'
        type: string
      filename:
        description: 'internal app identifier (must contain "connect" or "tech" for GL!TCH patches to apply)'
        required: true
        default: 'glitchconnect'
        type: string
      bundle_id:
        description: 'iOS bundle identifier'
        required: true
        default: 'com.tsisolutions.glitchconnect'
        type: string
      server:
        description: 'rendezvous server domain'
        required: true
        default: 'glitchdesk.com'
        type: string
      serverPort:
        description: 'rendezvous server port'
        required: true
        default: '21116'
        type: string
      key:
        description: 'relay public key'
        required: true
        default: 'sWpEvE4YljtHdRMzsw43lXeL34cI788Rc3FA2djzqcg='
        type: string
      apiServer:
        description: 'API server URL'
        required: true
        default: 'https://glitchdesk.com'
        type: string
      compname:
        description: 'company name shown in app'
        required: true
        default: 'Glitch Connect'
        type: string
      label:
        description: 'build label (shown in run name)'
        required: false
        default: ''
        type: string

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VERSION: "${{ inputs.version }}"
  appname: "${{ inputs.appname }}"
  filename: "${{ inputs.filename }}"
  compname: "${{ inputs.compname }}"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml
    with:
      version: ${{ inputs.version }}

  build-ios:
    name: Build iOS (unsigned)
    needs: [generate-bridge]
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        job:
          - { target: aarch64-apple-ios, arch: aarch64, vcpkg-triplet: arm64-ios }
    steps:
      - name: Install build dependencies
        run: brew install nasm yasm

      - name: Checkout source code
        if: ${{ env.VERSION != 'master' }}
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: refs/tags/${{ env.VERSION }}
          submodules: recursive

      - name: Checkout source code
        if: ${{ env.VERSION == 'master' }}
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@master
        with:
          name: bridge-artifact
          path: ./

      - name: Install flutter
        uses: subosito/flutter-action@v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{ env.FLUTTER_VERSION }} ]]; then
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Apply GL!TCH controller patches (Tech-tier ID visibility, mobile login gate)
        shell: bash
        env:
          GL_APP: ${{ env.appname }}
          FNAME: ${{ env.filename }}
          RUNNO: ${{ github.run_number }}
        run: |
          set -e
          BUILDTAG="build $RUNNO, $(date -u +%b-%d' '%H:%M) UTC"
          echo "== GL!TCH controller patches (iOS); appname: '$GL_APP' filename: '$FNAME' =="
          echo "::notice title=GL!TCH patch step::run $RUNNO appname='$GL_APP' filename='$FNAME'"
          LC="$(printf '%s %s' "$GL_APP" "$FNAME" | tr '[:upper:]' '[:lower:]')"
          if [[ "$LC" == *connect* || "$LC" == *tech* ]]; then
            git config core.autocrlf false
            echo '' | base64 -d > glitch-01-is-tech-field.diff
            echo '' | base64 -d > glitch-02-user-model-is-tech.diff
            echo '' | base64 -d > glitch-03-peer-card-id-gate.diff
            echo '' | base64 -d > glitch-06-mobile-id-box-gate.diff
            echo '' | base64 -d > glitch-07-mobile-login-gate.diff
            git apply --verbose glitch-01-is-tech-field.diff
            git apply --verbose glitch-02-user-model-is-tech.diff
            git apply --verbose glitch-03-peer-card-id-gate.diff
            git apply --verbose glitch-06-mobile-id-box-gate.diff
            git apply --verbose glitch-07-mobile-login-gate.diff
            echo '' | base64 -d > glitch-09-remove-connect-autocomplete-id.diff
            git apply --verbose glitch-09-remove-connect-autocomplete-id.diff
            grep -q "canSeeDeviceId" flutter/lib/models/user_model.dart || { echo "ERROR: Tech-tier patches missing"; exit 1; }
            grep -q "canSeeDeviceId" flutter/lib/mobile/pages/connection_page.dart || { echo "ERROR: mobile ID-box gate missing"; exit 1; }
            grep -q "_GlitchLoginGatePage" flutter/lib/mobile/pages/home_page.dart || { echo "ERROR: mobile login gate missing"; exit 1; }
            grep -q "peer.hostname.isNotEmpty" flutter/lib/common/widgets/peer_card.dart || { echo "ERROR: peer list ID-removal (hostname fallback) missing"; exit 1; }
            grep -q "peerPrimaryLabel($" flutter/lib/common/widgets/autocomplete.dart || { echo "ERROR: autocomplete ID-removal missing"; exit 1; }
            echo "Tech-tier ID visibility + login gate applied (iOS)"
            echo "Peer ID never shown (alias/hostname only) applied"

            # GL!TCH: brand accent color (same hex as Windows/macOS/Android builds); BSD sed on macOS runners
            sed -i '' -e 's|0071FF|B9F020|g' -e 's|2C8CFF|B9F020|g' flutter/lib/common.dart
            grep -q "B9F020" flutter/lib/common.dart || { echo "ERROR: brand color patch missing"; exit 1; }
            echo "brand accent applied: #B9F020"

            echo "::notice title=GL!TCH patches applied::loginGate=$(grep -c _GlitchLoginGatePage flutter/lib/mobile/pages/home_page.dart) techGate=$(grep -c canSeeDeviceId flutter/lib/mobile/pages/connection_page.dart) $BUILDTAG"
          else
            echo "Not a GlitchConnect/GlitchTech build; GL!TCH controller patches skipped"
            echo "::notice title=GL!TCH patches SKIPPED::appname='$GL_APP'"
          fi

      - name: Rebrand iOS app name and bundle id
        if: env.appname != 'rustdesk'
        shell: bash
        run: |
          sed -i '' -e "s|<string>RustDesk</string>|<string>${{ env.appname }}</string>|g" ./flutter/ios/Runner/Info.plist
          sed -i '' -e "s|com.carriez.flutterHbb|${{ inputs.bundle_id }}|g" ./flutter/ios/Runner.xcodeproj/project.pbxproj
          grep -q "${{ env.appname }}" ./flutter/ios/Runner/Info.plist || { echo "ERROR: iOS app name patch missing"; exit 1; }
          echo "bundle id occurrences: $(grep -c "${{ inputs.bundle_id }}" ./flutter/ios/Runner.xcodeproj/project.pbxproj)"

      - name: Set server, serverPort, key, apiServer
        shell: bash
        env:
          SERVER_DOMAIN: ${{ inputs.server }}
          SERVER_PORT_INPUT: ${{ inputs.serverPort }}
          SERVER_KEY: ${{ inputs.key }}
          API_SERVER: ${{ inputs.apiServer }}
        run: |
          if ! [[ "$SERVER_PORT_INPUT" =~ ^[0-9]+$ ]]; then
            echo "Error: serverPort must be a number, got: '$SERVER_PORT_INPUT'"
            exit 1
          fi
          SERVER_PORT=$SERVER_PORT_INPUT
          RELAY_PORT=$((SERVER_PORT + 1))
          WS_RENDEZVOUS_PORT=$((RELAY_PORT + 1))
          WS_RELAY_PORT=$((WS_RENDEZVOUS_PORT + 1))
          sed -i '' -e "s|rs-ny.rustdesk.com|$SERVER_DOMAIN|" ./libs/hbb_common/src/config.rs
          sed -i '' -e "s|pub const RENDEZVOUS_PORT: i32 = [0-9][0-9]*;|pub const RENDEZVOUS_PORT: i32 = $SERVER_PORT;|" ./libs/hbb_common/src/config.rs
          sed -i '' -e "s|pub const RELAY_PORT: i32 = [0-9][0-9]*;|pub const RELAY_PORT: i32 = $RELAY_PORT;|" ./libs/hbb_common/src/config.rs
          sed -i '' -e "s|pub const WS_RENDEZVOUS_PORT: i32 = [0-9][0-9]*;|pub const WS_RENDEZVOUS_PORT: i32 = $WS_RENDEZVOUS_PORT;|" ./libs/hbb_common/src/config.rs
          sed -i '' -e "s|pub const WS_RELAY_PORT: i32 = [0-9][0-9]*;|pub const WS_RELAY_PORT: i32 = $WS_RELAY_PORT;|" ./libs/hbb_common/src/config.rs
          sed -i '' -e "s|OeVuKk5nlHiXp+APNn0Y3pC1Iwpwn44JGqrQCsWqmBw=|$SERVER_KEY|" ./libs/hbb_common/src/config.rs
          sed -i '' -e "s|https://admin.rustdesk.com|$API_SERVER|" ./src/common.rs
          echo "=== Verification ==="
          grep -nE "RENDEZVOUS_PORT|RELAY_PORT|WS_" ./libs/hbb_common/src/config.rs

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet ${{ matrix.job.vcpkg-triplet }} --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"; cat "$_1"; echo ""
            done
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: rustdesk-lib-cache-ios
          key: ${{ matrix.job.target }}

      - name: Build rustdesk lib
        run: |
          rustup target add ${{ matrix.job.target }}
          cargo build --locked --features flutter,hwcodec --release --target ${{ matrix.job.target }} --lib

      - name: Build rustdesk (unsigned ipa)
        shell: bash
        run: |
          pushd flutter
          flutter build ipa --release --no-codesign
          popd

          # GL!TCH: "flutter build ipa --no-codesign" only ever produces the
          # .xcarchive - Xcode's own IPA export step requires a signing
          # identity, so Flutter deliberately stops there and prints
          # "Codesigning disabled with --no-codesign, skipping IPA." (this
          # is why every earlier attempt "succeeded" at building but then
          # failed to upload - there was never an .ipa to find). Package the
          # already-built .app into a standard unsigned IPA ourselves: a
          # "Payload/<App>.app" folder zipped with a .ipa extension, exactly
          # what sideloading tools (AltStore, Sideloadly) expect.
          ARCHIVE_APP=$(find flutter/build/ios/archive/Runner.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$ARCHIVE_APP" ]; then
            echo "::error::No .app found in the built archive"
            exit 1
          fi
          mkdir -p flutter/build/ios/ipa/Payload
          cp -r "$ARCHIVE_APP" flutter/build/ios/ipa/Payload/
          pushd flutter/build/ios/ipa
          zip -r -q "${{ env.filename }}-unsigned.ipa" Payload
          rm -rf Payload
          popd

      - name: Upload unsigned build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.filename }}-ios-unsigned
          path: flutter/build/ios/ipa/
          if-no-files-found: error
